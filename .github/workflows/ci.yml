name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Pinned Playwright image keeps fonts identical to the one used to generate the visual
    # baselines (scripts/update-visual-baselines.sh). Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - run: apt-get update && apt-get install -y build-essential python3
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      # Multi-arch build, nothing is pushed.
      - name: Build linux/amd64 + linux/arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Verify native modules load on each platform
        run: |
          for p in linux/amd64 linux/arm64; do
            docker buildx build --platform "$p" --load -t "rb:${p#*/}" .
            docker run --rm --platform "$p" "rb:${p#*/}" node -e "require('argon2'); require('better-sqlite3'); console.log('$p native ok')"
          done
