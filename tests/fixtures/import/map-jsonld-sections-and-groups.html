<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Two-part Sponge</title>
<script type="application/ld+json">{
 "@context": "https://schema.org",
 "@type": "Recipe",
 "name": "Two-part Sponge",
 "recipeIngredient": [
  "For the cake:",
  "200 g flour",
  "150 g sugar",
  "3 eggs",
  "For the frosting:",
  "100 g butter",
  "200 g powdered sugar"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToSection",
   "name": "Cake",
   "itemListElement": [
    { "@type": "HowToStep", "text": "Whisk the flour and sugar together." },
    { "@type": "HowToStep", "text": "Beat in the eggs." },
    { "@type": "HowToStep", "text": "Bake for 30 minutes at 180C." }
   ]
  },
  {
   "@type": "HowToSection",
   "name": "Frosting",
   "itemListElement": [
    { "@type": "HowToStep", "text": "Cream the butter until pale." },
    { "@type": "HowToStep", "text": "Beat in the powdered sugar." }
   ]
  }
 ]
}</script>
</head>
<body></body></html>
