<html lang="en"><head><meta charset="utf-8"><title>Pancakes</title>
<script type="application/ld+json">{

 "name": "Simple Pancakes",
 "recipeIngredient": [
  "1 1/2 cups flour",
  "½ tsp salt",
  "2-3 tbsp sugar",
  "1 large egg, beaten",
  "1 cup (240 ml) milk"
 ],
 "recipeInstructions": [
  {
   "@type": "HowToStep",
   "text": "Whisk everything together."
  },
  {
   "@type": "HowToStep",
   "text": "Rest the batter for ten minutes."
  },
  {
   "@type": "HowToStep",
   "text": "Fry in a hot pan until golden."
  }
 ]
}</script>
