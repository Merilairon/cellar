 "name": "Garlic Pasta",
 "recipeIngredient": [
  "200 g pasta",
  "2 tbsp olive oil",
  "3 cloves garlic",
  "50 g parmesan"
 ],
 "recipeInstructions": "1. Boil the pasta in salted water.\n2. Warm the olive oil and fry the garlic.\n3. Toss the pasta with the garlic oil.\n4. Serve with the parmesan on top."
